<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>B品報告アプリ (スマホ特化版)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html5-qrcode CDN -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; -webkit-tap-highlight-color: transparent; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
    #reader video { border-radius: 1rem; object-fit: cover !important; }
    #reader { border: none !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen antialiased select-none pb-28">

  <!-- 1. コンパクトヘッダー (初期設定の折りたたみ・省スペース化) -->
  <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-md mx-auto px-3.5 py-2 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-7 h-7 rounded-lg bg-rose-600 flex items-center justify-center font-black text-white text-xs shadow-xs">B</div>
        <span class="font-extrabold text-sm tracking-tight">B品報告</span>
      </div>
      <!-- 設定チップ（タップで作業者・移動元を変更） -->
      <button onclick="openConfigModal()" class="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded-full text-xs font-semibold border border-slate-700 active:scale-95 transition">
        <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span id="headerWorkerName" class="font-bold text-emerald-400 max-w-[90px] truncate">未設定</span>
        <span class="text-slate-500">|</span>
        <span class="font-mono text-slate-300">元:<span id="headerSourceWh">1001</span></span>
      </button>
    </div>
  </header>

  <!-- メイン作業領域（スマホ片手操作特化） -->
  <main class="max-w-md mx-auto px-3.5 pt-3 space-y-3.5">

    <!-- 2. スキャン優先レイアウト (Hero Scan & Product Display) -->
    <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/90 space-y-3">
      <!-- カメラ起動中エリア（横長枠） -->
      <div id="scannerWrapper" class="hidden bg-black rounded-2xl p-2 relative overflow-hidden">
        <div id="reader" class="w-full"></div>
        <div class="mt-2 flex items-center justify-between px-2">
          <span class="text-xs text-slate-300 font-bold">JANコードを横長枠内に合わせてください</span>
          <button type="button" onclick="stopScanner()" class="px-3 py-1 bg-red-600 text-white text-xs rounded-lg font-bold">閉じる</button>
        </div>
      </div>

      <!-- スキャン前: カメラ起動大ボタン -->
      <div id="noProductSection" class="space-y-2">
        <button type="button" onclick="startScanner()" class="w-full h-24 bg-gradient-to-br from-slate-900 to-slate-800 active:scale-[0.98] text-white rounded-2xl shadow-sm border border-slate-700 flex flex-col items-center justify-center space-y-1 transition group">
          <div class="w-9 h-9 rounded-xl bg-rose-600/30 border border-rose-500/50 flex items-center justify-center">
            <svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          </div>
          <span class="font-extrabold text-sm tracking-wide">タップしてカメラ起動 (爆速認識)</span>
          <span class="text-[10px] text-slate-400">JAN / CODE-128 対応</span>
        </button>

        <button type="button" onclick="openSearchModal()" class="w-full py-2 bg-slate-100 hover:bg-slate-200 active:scale-98 text-slate-700 rounded-xl font-bold text-xs transition flex items-center justify-center space-x-1">
          <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <span>バーコードが読めない場合は手動検索</span>
        </button>
      </div>

      <!-- スキャン成功時: ★商品名・サイズを画面中央に大きく太字表示 -->
      <div id="productDetails" class="hidden space-y-2">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <span id="dispProductCode" class="font-mono-num text-xs font-bold bg-slate-100 text-slate-800 px-2 py-0.5 rounded border border-slate-200"></span>
            <span id="dispSize" class="font-bold text-xs bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded border border-indigo-200"></span>
          </div>
          <button type="button" onclick="startScanner()" class="text-xs font-bold text-rose-600 py-1 px-2.5 rounded-lg bg-rose-50 border border-rose-200/80 active:scale-95 transition">
            再スキャン
          </button>
        </div>

        <div class="py-1">
          <h2 id="dispName1" class="text-xl sm:text-2xl font-black text-slate-900 leading-snug"></h2>
          <p id="dispName2" class="text-xs text-slate-500 font-medium mt-0.5 truncate"></p>
        </div>

        <div class="pt-1 flex items-center justify-between text-xs font-mono-num text-slate-400 border-t border-slate-100">
          <span>JAN: <strong id="dispJan" class="text-slate-700"></strong></span>
          <button type="button" onclick="clearSelectedProduct()" class="text-[11px] text-slate-400 hover:text-slate-600 font-sans">クリア</button>
        </div>
      </div>
    </div>

    <!-- 3. 移動先倉庫（ワンタップ2連大ボタン） -->
    <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/90 space-y-2">
      <label class="block text-xs font-extrabold text-slate-700">移動先倉庫 <span class="text-rose-500">*</span></label>
      <div class="grid grid-cols-2 gap-2.5">
        <button type="button" id="btnWh1008" onclick="selectDestWarehouse('1008')" class="h-14 rounded-2xl border-2 font-black transition flex flex-col items-center justify-center select-none active:scale-95 bg-amber-400 border-amber-500 text-slate-950 shadow-sm">
          <span class="text-sm">B品倉庫 (1008)</span>
          <span class="text-[10px] font-mono opacity-80">キズ・汚れ・廃棄</span>
        </button>
        <button type="button" id="btnWh1006" onclick="selectDestWarehouse('1006')" class="h-14 rounded-2xl border-2 font-black transition flex flex-col items-center justify-center select-none active:scale-95 bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100">
          <span class="text-sm">直し倉庫 (1006)</span>
          <span class="text-[10px] font-mono opacity-80">リペア・再検品</span>
        </button>
      </div>
    </div>

    <!-- 4. 発生理由（ワンタップ選択・ボタングリッド） -->
    <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/90 space-y-2.5">
      <div class="flex items-center justify-between">
        <label class="text-xs font-extrabold text-slate-700">発生理由 <span class="text-rose-500">*</span></label>
        <span class="text-[10px] text-slate-400">タップで即切替</span>
      </div>

      <!-- 理由ボタングリッド（3列表示） -->
      <div id="reasonsGrid" class="grid grid-cols-3 gap-2">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- 5. 数量ステッパー -->
    <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/90 flex items-center justify-between">
      <div>
        <label class="block text-xs font-extrabold text-slate-700">数量 (個体数)</label>
        <span class="text-[10px] text-slate-400">※数量分だけ1点ずつ連続採番</span>
      </div>
      <div class="flex items-center space-x-2">
        <button type="button" onclick="adjustQty(-1)" class="w-12 h-12 rounded-2xl bg-slate-100 hover:bg-slate-200 active:scale-90 flex items-center justify-center text-2xl font-black text-slate-800 select-none">-</button>
        <input type="number" id="quantity" min="1" max="999" value="1" class="w-16 h-12 text-center font-mono-num font-black text-2xl bg-slate-50 border border-slate-300 rounded-2xl focus:ring-2 focus:ring-slate-900 focus:outline-none">
        <button type="button" onclick="adjustQty(1)" class="w-12 h-12 rounded-2xl bg-slate-100 hover:bg-slate-200 active:scale-90 flex items-center justify-center text-2xl font-black text-slate-800 select-none">+</button>
      </div>
    </div>

  </main>

  <!-- 4. 画面下部固定の特大送信ボタン (Sticky Bottom / 高さ54px / 高コントラスト) -->
  <div class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 p-3 shadow-lg">
    <div class="max-w-md mx-auto">
      <button id="submitBtn" type="button" onclick="submitReport()" disabled
        class="w-full h-14 rounded-2xl font-black text-base shadow-lg transition flex items-center justify-center space-x-2 select-none active:scale-[0.99] bg-slate-200 text-slate-400 cursor-not-allowed">
        <span id="submitBtnText">商品バーコードをスキャンしてください</span>
      </button>
    </div>
  </div>

  <!-- 5. タグ記入用モーダル (送信完了時・超大文字表示) -->
  <div id="tagModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-xs p-4 hidden">
    <div class="bg-white rounded-3xl max-w-sm w-full shadow-2xl overflow-hidden text-center animate-in fade-in zoom-in-95 duration-200 border border-slate-200">
      <div class="bg-rose-600 text-white py-3 px-4 font-black text-sm tracking-wide">
        送信完了！ 実物タグに番号を転記してください
      </div>
      <div class="p-5 space-y-3.5">
        <div>
          <span class="text-[11px] font-bold text-slate-500 uppercase tracking-widest block">TAG ASSIGNMENT</span>
          <span class="text-xs font-extrabold text-slate-700">タグ記入用 通し番号</span>

          <!-- ★ 超巨大文字の通し番号表示 -->
          <div class="my-3 py-5 px-3 bg-gradient-to-b from-amber-50 to-amber-100/70 rounded-2xl border-2 border-amber-300 shadow-inner">
            <div id="modalSeqNo" class="text-4xl sm:text-5xl font-black font-mono-num text-rose-600 tracking-tight leading-none">
              No. ---
            </div>
            <div id="modalSubCount" class="text-[11px] font-bold text-amber-900 mt-1.5 hidden"></div>
          </div>
        </div>

        <!-- 複数点の場合の個別実物タグチェックリスト -->
        <div id="modalMultiTagsList" class="hidden p-2.5 bg-slate-50 rounded-xl border border-slate-200 text-left">
          <div class="text-[11px] font-bold text-slate-700 mb-1.5">実物タグ記入チェック（タップで完了）:</div>
          <div id="modalTagItemsContainer" class="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto"></div>
        </div>

        <!-- Tag Details Summary -->
        <div class="bg-slate-50 rounded-xl p-3 text-left text-xs space-y-1 text-slate-600 border border-slate-200">
          <div class="flex justify-between"><span class="text-slate-400">商品コード:</span><span id="modalProductCode" class="font-bold text-slate-800"></span></div>
          <div class="flex justify-between"><span class="text-slate-400">商品名:</span><span id="modalProductName" class="font-bold text-slate-800 truncate max-w-[180px]"></span></div>
          <div class="flex justify-between"><span class="text-slate-400">移動先:</span><span id="modalDest" class="font-bold text-slate-800"></span></div>
          <div class="flex justify-between"><span class="text-slate-400">発生理由:</span><span id="modalReason" class="font-bold text-slate-800"></span></div>
        </div>

        <!-- ★「次のスキャンへ」大ボタンで即カメラ復帰 -->
        <button type="button" onclick="closeTagModalAndNext()" class="w-full h-14 bg-slate-900 hover:bg-slate-800 active:scale-[0.98] text-white font-black rounded-2xl text-base shadow-md transition flex items-center justify-center space-x-2">
          <span>次のスキャンへ</span>
          <svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 設定変更モーダル（作業者名 ＆ 移動元倉庫） -->
  <div id="configModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-xs p-4 hidden">
    <div class="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl">
      <h3 class="text-base font-black text-slate-900 mb-1">初期設定の編集</h3>
      <p class="text-xs text-slate-500 mb-4">一度保存すると端末（localStorage）に保持されます。</p>
      
      <div class="space-y-3 mb-5">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">作業者名</label>
          <input type="text" id="configWorkerInput" placeholder="山田 太郎" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2 text-sm font-semibold focus:ring-2 focus:ring-slate-900 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">移動元倉庫コード</label>
          <input type="text" id="configSourceWhInput" placeholder="1001" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2 text-sm font-semibold font-mono focus:ring-2 focus:ring-slate-900 focus:outline-none">
        </div>
      </div>

      <div class="flex space-x-2">
        <button type="button" onclick="closeConfigModal()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl">キャンセル</button>
        <button type="button" onclick="saveConfigModal()" class="flex-1 py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl">保存する</button>
      </div>
    </div>
  </div>

  <!-- 手動検索モーダル -->
  <div id="searchModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-xs p-4 hidden">
    <div class="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl flex flex-col max-h-[85vh]">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-base font-black text-slate-900">商品マスタ手動検索</h3>
        <button onclick="closeSearchModal()" class="text-slate-400 hover:text-slate-700 text-2xl font-bold">&times;</button>
      </div>
      <input type="text" id="searchInput" placeholder="JAN / 商品名 / コードで検索..."
        class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2 text-sm mb-3 focus:ring-2 focus:ring-slate-900 focus:outline-none"
        oninput="filterMasterList(this.value)">
      <div id="searchResultsList" class="overflow-y-auto flex-1 divide-y divide-slate-100 pr-1 space-y-1"></div>
    </div>
  </div>

  <!-- Audio & Vibration Feedback -->
  <script>
    function triggerHaptic(pattern = 60) {
      try {
        if ('vibrate' in navigator && typeof navigator.vibrate === 'function') {
          navigator.vibrate(pattern);
        }
      } catch (e) {}
    }

    function playBeep() {
      triggerHaptic(60);
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(2093, ctx.currentTime); // High C7
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.07);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.07);
      } catch (e) {}
    }

    function playSuccessChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.1);
          gain.gain.setValueAtTime(0.2, now + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.1);
          osc.stop(now + idx * 0.1 + 0.2);
        });
      } catch (e) {}
    }
  </script>

  <!-- Application Logic -->
  <script>
    const DEFAULT_REASONS = [
      'コード破断', '擦り傷', '編み緩み', '編みきつい',
      '編み飛ばし', '汚れ', '黄ばみ', '異臭', '異物'
    ];

    const DEFAULT_MASTER = [
      { productCode: 'KN-2024-001', name1: 'プレミアムメリノウールセーター', name2: 'クルーネック / ネイビー', size: 'M', janCode: '4901234567890' },
      { productCode: 'KN-2024-002', name1: 'プレミアムメリノウールセーター', name2: 'クルーネック / ネイビー', size: 'L', janCode: '4901234567891' },
      { productCode: 'CD-5010-WHT', name1: 'ハイテンションコード編みパーカー', name2: 'ドローコード / ホワイト', size: 'FREE', janCode: '4560123456789' }
    ];

    let productMaster = [...DEFAULT_MASTER];
    let selectedProduct = null;
    let selectedDestWh = '1008';
    let selectedReason = 'コード破断';
    let html5QrScanner = null;
    let isSubmitting = false;
    let isScanLocked = false;
    let lastScannedTime = 0;

    window.addEventListener('DOMContentLoaded', () => {
      initConfig();
      renderReasonsGrid();
      loadProductMaster();
      updateSubmitBtn();
    });

    // 1. 設定の初期化 & 表示
    function initConfig() {
      const name = localStorage.getItem('bhin_worker_name') || '';
      const sourceWh = localStorage.getItem('bhin_source_warehouse') || '1001';
      document.getElementById('headerWorkerName').textContent = name || '担当未設定';
      document.getElementById('headerSourceWh').textContent = sourceWh;
    }

    function openConfigModal() {
      document.getElementById('configWorkerInput').value = localStorage.getItem('bhin_worker_name') || '';
      document.getElementById('configSourceWhInput').value = localStorage.getItem('bhin_source_warehouse') || '1001';
      document.getElementById('configModal').classList.remove('hidden');
    }
    function closeConfigModal() {
      document.getElementById('configModal').classList.add('hidden');
    }
    function saveConfigModal() {
      const worker = document.getElementById('configWorkerInput').value.trim();
      const wh = document.getElementById('configSourceWhInput').value.trim() || '1001';
      localStorage.setItem('bhin_worker_name', worker);
      localStorage.setItem('bhin_source_warehouse', wh);
      initConfig();
      closeConfigModal();
    }

    // 2. 移動先倉庫 選択（大きな2連ボタン）
    function selectDestWarehouse(wh) {
      selectedDestWh = wh;
      const b1008 = document.getElementById('btnWh1008');
      const b1006 = document.getElementById('btnWh1006');
      if (wh === '1008') {
        b1008.className = 'h-14 rounded-2xl border-2 font-black transition flex flex-col items-center justify-center select-none active:scale-95 bg-amber-400 border-amber-500 text-slate-950 shadow-sm';
        b1006.className = 'h-14 rounded-2xl border-2 font-black transition flex flex-col items-center justify-center select-none active:scale-95 bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100';
      } else {
        b1006.className = 'h-14 rounded-2xl border-2 font-black transition flex flex-col items-center justify-center select-none active:scale-95 bg-blue-600 border-blue-700 text-white shadow-sm';
        b1008.className = 'h-14 rounded-2xl border-2 font-black transition flex flex-col items-center justify-center select-none active:scale-95 bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100';
      }
    }

    // 3. 発生理由ボタングリッド
    function getStoredReasons() {
      const custom = localStorage.getItem('bhin_custom_reasons');
      if (!custom) return [...DEFAULT_REASONS];
      try {
        const parsed = JSON.parse(custom);
        return Array.from(new Set([...DEFAULT_REASONS, ...parsed]));
      } catch (e) {
        return [...DEFAULT_REASONS];
      }
    }

    function renderReasonsGrid() {
      const container = document.getElementById('reasonsGrid');
      container.innerHTML = '';
      const list = getStoredReasons();

      list.forEach(r => {
        const isSelected = selectedReason === r;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = isSelected
          ? 'h-12 rounded-xl text-xs font-black border transition flex items-center justify-center select-none active:scale-95 bg-slate-900 text-white border-slate-900 shadow-xs ring-2 ring-rose-500/60'
          : 'h-12 rounded-xl text-xs font-bold border transition flex items-center justify-center select-none active:scale-95 bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100';
        btn.innerHTML = `<span class="truncate px-1">${r}</span>`;
        btn.onclick = () => {
          selectedReason = r;
          renderReasonsGrid();
        };
        container.appendChild(btn);
      });

      // ＋ 理由追加ボタン
      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'h-12 rounded-xl text-xs font-bold border-2 border-dashed border-indigo-300 bg-indigo-50/70 hover:bg-indigo-100 text-indigo-700 transition flex items-center justify-center space-x-1 active:scale-95 select-none';
      addBtn.innerHTML = `<span>＋ 理由追加</span>`;
      addBtn.onclick = () => {
        const val = prompt('新しい発生理由を入力してください:');
        if (val && val.trim()) {
          const reason = val.trim();
          let customOnly = [];
          try {
            customOnly = JSON.parse(localStorage.getItem('bhin_custom_reasons') || '[]');
          } catch (e) {}
          if (!customOnly.includes(reason)) {
            customOnly.push(reason);
            localStorage.setItem('bhin_custom_reasons', JSON.stringify(customOnly));
          }
          selectedReason = reason;
          renderReasonsGrid();
        }
      };
      container.appendChild(addBtn);
    }

    // 4. マスタデータ取得
    function loadProductMaster() {
      const cached = localStorage.getItem('bhin_product_master');
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          if (Array.isArray(parsed) && parsed.length > 0) productMaster = parsed;
        } catch (e) {}
      }
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler(function(master) {
          if (Array.isArray(master) && master.length > 0) {
            productMaster = master;
            localStorage.setItem('bhin_product_master', JSON.stringify(master));
          }
        }).getProductMasterData();
      }
    }

    // 5. 数量ステッパー
    function adjustQty(delta) {
      const input = document.getElementById('quantity');
      let val = parseInt(input.value, 10) || 1;
      val = Math.max(1, val + delta);
      input.value = val;
      updateSubmitBtn();
    }

    // 6. バーコードスキャナ (html5-qrcode: 爆速・高感度JAN専用)
    function startScanner() {
      const wrapper = document.getElementById('scannerWrapper');
      wrapper.classList.remove('hidden');

      if (!html5QrScanner) {
        html5QrScanner = new Html5Qrcode("reader", {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.CODE_128
          ],
          verbose: false
        });
      }

      const config = {
        fps: 25,
        qrbox: (w, h) => {
          const width = Math.min(320, Math.max(240, Math.floor(w * 0.85)));
          const height = Math.min(130, Math.max(90, Math.floor(w * 0.38)));
          return { width, height };
        },
        aspectRatio: 1.777778
      };

      html5QrScanner.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
          const now = Date.now();
          if (isScanLocked || now - lastScannedTime < 1500) return;
          isScanLocked = true;
          lastScannedTime = now;

          playBeep();
          stopScanner();
          handleBarcodeScanned(decodedText.trim());

          setTimeout(() => { isScanLocked = false; }, 1500);
        },
        () => {}
      ).catch(err => {
        alert("カメラ起動エラー: " + err);
        stopScanner();
      });
    }

    function stopScanner() {
      if (html5QrScanner) {
        html5QrScanner.stop().then(() => {
          document.getElementById('scannerWrapper').classList.add('hidden');
        }).catch(() => {
          document.getElementById('scannerWrapper').classList.add('hidden');
        });
      } else {
        document.getElementById('scannerWrapper').classList.add('hidden');
      }
    }

    function handleBarcodeScanned(jan) {
      const match = productMaster.find(p => p.janCode === jan);
      if (match) {
        selectProduct(match);
      } else {
        selectProduct({
          productCode: 'JAN-' + jan.slice(-6),
          name1: 'スキャン商品 (マスタ未登録)',
          name2: '手動確認要',
          size: '-',
          janCode: jan
        });
      }
    }

    function selectProduct(product) {
      selectedProduct = product;
      document.getElementById('noProductSection').classList.add('hidden');
      document.getElementById('productDetails').classList.remove('hidden');

      document.getElementById('dispProductCode').textContent = product.productCode;
      document.getElementById('dispSize').textContent = 'SIZE: ' + product.size;
      document.getElementById('dispName1').textContent = product.name1;
      document.getElementById('dispName2').textContent = product.name2 || '';
      document.getElementById('dispJan').textContent = product.janCode;

      closeSearchModal();
      updateSubmitBtn();
    }

    function clearSelectedProduct() {
      selectedProduct = null;
      document.getElementById('noProductSection').classList.remove('hidden');
      document.getElementById('productDetails').classList.add('hidden');
      updateSubmitBtn();
    }

    function updateSubmitBtn() {
      const btn = document.getElementById('submitBtn');
      const text = document.getElementById('submitBtnText');
      const qty = parseInt(document.getElementById('quantity').value, 10) || 1;

      if (!selectedProduct) {
        btn.disabled = true;
        btn.className = 'w-full h-14 rounded-2xl font-black text-base shadow-lg transition flex items-center justify-center space-x-2 select-none bg-slate-200 text-slate-400 cursor-not-allowed';
        text.textContent = '商品バーコードをスキャンしてください';
      } else {
        btn.disabled = false;
        btn.className = 'w-full h-14 rounded-2xl font-black text-base shadow-lg transition flex items-center justify-center space-x-2 select-none active:scale-[0.99] bg-rose-600 hover:bg-rose-700 text-white shadow-rose-600/30';
        text.textContent = qty > 1 
          ? '' + qty + '点 登録する (No.〇〇～連番)' 
          : '登録する (通し番号を発番)';
      }
    }

    // 7. 手動検索モーダル
    function openSearchModal() {
      document.getElementById('searchInput').value = '';
      filterMasterList('');
      document.getElementById('searchModal').classList.remove('hidden');
    }
    function closeSearchModal() {
      document.getElementById('searchModal').classList.add('hidden');
    }
    function filterMasterList(query) {
      const q = query.toLowerCase().trim();
      const list = document.getElementById('searchResultsList');
      list.innerHTML = '';
      const filtered = productMaster.filter(p =>
        p.productCode.toLowerCase().includes(q) ||
        p.name1.toLowerCase().includes(q) ||
        p.janCode.includes(q)
      );
      if (filtered.length === 0) {
        list.innerHTML = '<div class="py-6 text-center text-xs text-slate-400">該当する商品がありません</div>';
        return;
      }
      filtered.forEach(p => {
        const row = document.createElement('div');
        row.className = 'p-3 hover:bg-slate-50 cursor-pointer rounded-xl flex items-center justify-between transition';
        row.onclick = () => selectProduct(p);
        row.innerHTML = '<div>' +
          '<div class="font-bold text-xs text-slate-900">' + p.name1 + '</div>' +
          '<div class="text-[11px] text-slate-500 font-mono-num">' + p.productCode + ' / ' + p.size + ' / ' + p.janCode + '</div>' +
          '</div>' +
          '<button class="px-2.5 py-1 text-xs bg-slate-900 text-white rounded-lg font-bold">選択</button>';
        list.appendChild(row);
      });
    }

    // 8. 送信処理 & 1点1採番展開
    function submitReport() {
      if (isSubmitting || !selectedProduct) return;

      const worker = localStorage.getItem('bhin_worker_name') || '';
      if (!worker) {
        alert('作業者名を設定してください');
        openConfigModal();
        return;
      }

      const sourceWh = localStorage.getItem('bhin_source_warehouse') || '1001';
      const quantity = parseInt(document.getElementById('quantity').value, 10) || 1;

      const payload = {
        workerName: worker,
        sourceWarehouse: sourceWh,
        destWarehouse: selectedDestWh,
        reason: selectedReason,
        productCode: selectedProduct.productCode,
        name1: selectedProduct.name1,
        name2: selectedProduct.name2,
        size: selectedProduct.size,
        janCode: selectedProduct.janCode,
        quantity: quantity
      };

      setSubmitLoading(true);

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            setSubmitLoading(false);
            if (res && res.success) {
              const numbers = res.assignedNumbers || [res.assignedNumber];
              onReportSuccess(numbers, payload, res.timestamp);
            } else {
              alert('送信エラー: ' + (res.error || '不明'));
            }
          })
          .withFailureHandler(function(err) {
            setSubmitLoading(false);
            alert('GAS通信エラー: ' + err);
          })
          .sendInventoryData(payload);
      } else {
        setTimeout(() => {
          setSubmitLoading(false);
          let lastNo = parseInt(localStorage.getItem('bhin_last_seq_no') || '100', 10);
          const numbers = [];
          for (let i = 1; i <= quantity; i++) numbers.push(lastNo + i);
          localStorage.setItem('bhin_last_seq_no', (lastNo + quantity).toString());

          const d = new Date();
          const pad = n => n.toString().padStart(2, '0');
          const timeStr = d.getFullYear() + '/' + pad(d.getMonth()+1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
          onReportSuccess(numbers, payload, timeStr);
        }, 500);
      }
    }

    function setSubmitLoading(loading) {
      isSubmitting = loading;
      const btn = document.getElementById('submitBtn');
      const text = document.getElementById('submitBtnText');
      if (loading) {
        btn.disabled = true;
        text.textContent = '排他ロック取得 & 個別展開採番中...';
      } else {
        updateSubmitBtn();
      }
    }

    // ★ 9. 巨大文字 採番モーダル
    function onReportSuccess(assignedNumbers, payload, timestamp) {
      playSuccessChime();
      const count = assignedNumbers.length;
      const startNo = assignedNumbers[0];
      const endNo = assignedNumbers[count - 1];

      const modalSeqNo = document.getElementById('modalSeqNo');
      const modalSubCount = document.getElementById('modalSubCount');
      const multiTagsList = document.getElementById('modalMultiTagsList');
      const tagsContainer = document.getElementById('modalTagItemsContainer');

      if (count > 1) {
        modalSeqNo.textContent = 'No. ' + startNo + ' ～ No. ' + endNo;
        modalSeqNo.className = 'text-3xl sm:text-4xl font-black font-mono-num text-rose-600 tracking-tight leading-tight';
        modalSubCount.textContent = '（全 ' + count + ' 点 · 1商品1行展開完了）';
        modalSubCount.classList.remove('hidden');

        tagsContainer.innerHTML = '';
        assignedNumbers.forEach((num, idx) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'px-2.5 py-1 rounded-lg border border-slate-300 bg-white text-xs font-mono-num font-bold active:scale-95 transition';
          btn.textContent = '[ ] No.' + num + ' (' + (idx+1) + '/' + count + ')';
          btn.onclick = function() {
            if (this.classList.contains('bg-emerald-100')) {
              this.className = 'px-2.5 py-1 rounded-lg border border-slate-300 bg-white text-xs font-mono-num font-bold active:scale-95 transition';
              this.textContent = '[ ] No.' + num + ' (' + (idx+1) + '/' + count + ')';
            } else {
              this.className = 'px-2.5 py-1 rounded-lg border border-emerald-400 bg-emerald-100 text-xs font-mono-num font-bold text-emerald-900 line-through';
              this.textContent = '[✓] No.' + num + ' (済)';
            }
          };
          tagsContainer.appendChild(btn);
        });
        multiTagsList.classList.remove('hidden');
      } else {
        modalSeqNo.textContent = 'No. ' + startNo;
        modalSeqNo.className = 'text-5xl sm:text-6xl font-black font-mono-num text-rose-600 tracking-tight leading-none';
        modalSubCount.classList.add('hidden');
        multiTagsList.classList.add('hidden');
      }

      document.getElementById('modalProductCode').textContent = payload.productCode;
      document.getElementById('modalProductName').textContent = payload.name1;
      document.getElementById('modalDest').textContent = payload.destWarehouse === '1008' ? 'B品倉庫 (1008)' : '直し倉庫 (1006)';
      document.getElementById('modalReason').textContent = payload.reason;

      document.getElementById('tagModal').classList.remove('hidden');
    }

    // ★「次のスキャンへ」大ボタンで即カメラ復帰
    function closeTagModalAndNext() {
      document.getElementById('tagModal').classList.add('hidden');
      clearSelectedProduct();
      document.getElementById('quantity').value = 1;
      updateSubmitBtn();
      // 直ちにカメラを起動
      startScanner();
    }
  </script>
</body>
